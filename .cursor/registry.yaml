# Spec-Driven 工作流 · 精选 Skill 注册表
# 维度 → skill 的显式映射。编排层在每个阶段按维度查表激活对应 skill。
# 未命中时：先问用户「是否需要专门 skill」，详见 .cursor/rules/workflow-orchestration.mdc
version: 1
updated: 2026-06-02

# source 取值：
#   local      手工精选，路径指向本机已安装的 skill
#   discovered 联网补全后经审查固化（来源记录在 origin 字段）
# bind_phase：该维度在哪些 Spec Kit 阶段被激活
#   可选值 specify / clarify / plan / analyze / tasks / implement / verify / constitution
#
# 渐进披露（progressive disclosure）：
#   summary  = L1，一行 what+when，命中即注入（便宜）
#   path     = L2，全文 SKILL.md，仅当本阶段确需细则时再 Read（贵）
#   细则附件 = L3，skill 内 references/，按需再下钻
#
# activate_if：机器可读激活条件（仅条件维度有）。元素语义：
#   bareFlag   -> stack.yml[bareFlag] 为真才激活（如 backend / ui）
#   key=value  -> stack.yml[key] 等于 value 才激活（如 cloud=gcp）
#   全部满足（AND）才激活。由 .specify/scripts/bash/activate-dimensions.sh 判定。
#   when 字段保留作人类可读说明，不参与机器判定。

